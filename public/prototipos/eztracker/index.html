<style>
:root{--ink:#111827;--muted:#5A6478;--line:#DFDFE0;--bg:#F3F5FB;--accent:#6691FF;--accent-d:#4075FF;--err:#B31935}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:Poppins,Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px 32px;box-shadow:0 30px 60px -36px rgba(17,24,39,.45)}
.lock{width:44px;height:44px;border-radius:12px;background:#ECF1FF;color:var(--accent);display:grid;place-items:center;margin-bottom:20px}
h1{font-size:1.45rem;font-weight:600;letter-spacing:-.01em;margin-bottom:10px}
p{color:var(--muted);font-size:.95rem;line-height:1.55}
label{display:block;font-size:.88rem;font-weight:500;margin:24px 0 8px}
input{width:100%;height:46px;padding:0 14px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:1rem;color:var(--ink);background:#fff;letter-spacing:.04em}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #CDDAFB}
input[aria-invalid=true]{border-color:#FF607D;background:#FFF5F7}
button{margin-top:14px;width:100%;height:46px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:500;font-size:.95rem;cursor:pointer}
button:hover{background:var(--accent-d)} button:disabled{opacity:.7;cursor:progress}
button:focus-visible{outline:none;box-shadow:0 0 0 4px #CDDAFB}
.err{color:var(--err);font-size:.85rem;margin-top:10px;min-height:1.2em}
.foot{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:.85rem}
.foot a{color:var(--accent-d);text-decoration:none;font-weight:500} .foot a:hover{text-decoration:underline}
.back{display:inline-block;margin-top:14px;color:var(--muted);font-size:.85rem;text-decoration:none}

<script>
(function(){
  var P=JSON.parse(document.getElementById('payload').textContent);
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  async function open(pw){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
    return new TextDecoder().decode(buf);
  }
  function show(html){document.open();document.write(html);document.close();}
  var f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),b=document.getElementById('b');
  try{var saved=sessionStorage.getItem('proto-pw');if(saved){open(saved).then(show).catch(function(){try{sessionStorage.removeItem('proto-pw')}catch(e){}});}}catch(e){}
  f.addEventListener('submit',function(e){
    e.preventDefault();err.textContent='';pw.removeAttribute('aria-invalid');b.disabled=true;b.textContent='Abrindo…';
    var v=pw.value.trim().toUpperCase();
    open(v).then(function(html){try{sessionStorage.setItem('proto-pw',v)}catch(e){}show(html)})
    .catch(function(){b.disabled=false;b.textContent='Abrir protótipo';pw.setAttribute('aria-invalid','true');err.textContent='Senha incorreta. Confira e tente de novo.';pw.select();});
  });
})();
</script></body></html>
